name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Chrome
        run: |
          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O chrome.deb

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ./chrome.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create virtual environment
        run: python -m venv env

      - name: Install build tools
        run: |
          env/bin/python -m pip install --upgrade pip
          env/bin/pip install mymarkup luxresume

      - name: Build mymarkup files
        run: env/bin/mymarkup

      - name: Build resume
        run: env/bin/luxresume Mizuki-Hikaru-Resume.yaml

      # Don't include the Python virtual environment in the website.
      - name: Remove build-only files
        run: rm -rf env

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
